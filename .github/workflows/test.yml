name: PostgreSQL reliability tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slotbook
          POSTGRES_PASSWORD: slotbook_ci
          POSTGRES_DB: slotbook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U slotbook -d slotbook_test"
          --health-interval=5s --health-timeout=3s --health-retries=15
    env:
      TEST_DATABASE_URL: postgresql://slotbook:slotbook_ci@localhost:5432/slotbook_test
      DATABASE_URL: postgresql://slotbook:slotbook_ci@localhost:5432/slotbook_test
      DEMO_EMAIL: demo@slotbook.local
      DEMO_PASSWORD: DemoPass!2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
