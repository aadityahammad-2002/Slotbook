services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slotbook
      POSTGRES_PASSWORD: slotbook_dev_password
      POSTGRES_DB: slotbook
    volumes:
      - slotbook_pg:/var/lib/postgresql/data
      - ./server/sql/docker-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotbook -d slotbook"]
      interval: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://slotbook:slotbook_dev_password@db:5432/slotbook
      TEST_DATABASE_URL: postgresql://slotbook:slotbook_dev_password@db:5432/slotbook_test
      PORT: "3000"
      COOKIE_SECURE: "false"
      DEMO_EMAIL: demo@slotbook.local
      DEMO_PASSWORD: DemoPass!2026
    ports:
      - "3000:3000"
  test:
    build: .
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://slotbook:slotbook_dev_password@db:5432/slotbook
      TEST_DATABASE_URL: postgresql://slotbook:slotbook_dev_password@db:5432/slotbook_test
      DEMO_EMAIL: demo@slotbook.local
      DEMO_PASSWORD: DemoPass!2026
    command: ["npm", "test"]
volumes:
  slotbook_pg:
